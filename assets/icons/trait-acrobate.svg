<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Acrobate Né</title>
  <circle cx="50" cy="50" r="48" fill="#1a0a02" stroke="#5a3a08" stroke-width="2"/>

  <!-- silhouette en roue -->
  <circle cx="50" cy="26" r="6" fill="#e8c060"/>
  <!-- corps en extension -->
  <line x1="50" y1="32" x2="50" y2="52" stroke="#e8c060" stroke-width="3" stroke-linecap="round"/>
  <!-- bras tendus en V -->
  <line x1="50" y1="40" x2="26" y2="30" stroke="#e8c060" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="40" x2="74" y2="30" stroke="#e8c060" stroke-width="3" stroke-linecap="round"/>
  <!-- jambes écartées -->
  <line x1="50" y1="52" x2="28" y2="68" stroke="#e8c060" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="52" x2="72" y2="68" stroke="#e8c060" stroke-width="3" stroke-linecap="round"/>
  <!-- étoiles de mouvement -->
  <circle cx="22" cy="70" r="3" fill="#e8c060" opacity="0.6"/>
  <circle cx="78" cy="70" r="3" fill="#e8c060" opacity="0.6"/>
  <circle cx="50" cy="78" r="3" fill="#e8c060" opacity="0.4"/>
</svg>