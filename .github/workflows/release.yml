name: Release Arkéos

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraire la version depuis le tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Mettre à jour system.json (version + download)
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          jq --arg v "$VERSION" \
             --arg dl "https://github.com/magisterphamtom/arkeos/releases/download/v${VERSION}/arkeos.zip" \
             '.version = $v | .download = $dl' \
             system.json > system.json.tmp && mv system.json.tmp system.json

      - name: Créer le ZIP (fichiers à la racine)
        run: |
          zip -r arkeos.zip . \
            --exclude "*.git*" \
            --exclude ".github/*" \
            --exclude "node_modules/*" \
            --exclude "*.zip"

      - name: Joindre manifeste et ZIP à la release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            system.json
            arkeos.zip
