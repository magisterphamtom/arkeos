  <text x="50" y="26" font-size="4" text-anchor="middle" fill="#1a1a1a" font-family="serif">PRESSE</text>
  <!-- Corps / veste journaliste -->
  <path d="M34 36 L66 36 L68 78 L50 83 L32 78 Z" fill="#4a3a28"/>
  <!-- Chemise / cravate -->
  <path d="M43 36 L50 56 L57 36" fill="#f0e8d0"/>
