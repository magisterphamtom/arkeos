  <rect x="10" y="46" width="14" height="10" rx="2" fill="#2a2a2a"/>
  <circle cx="17" cy="51" r="4" fill="#1a1a1a"/>
  <circle cx="17" cy="51" r="2.5" fill="#333"/>
  <circle cx="17" cy="51" r="1" fill="#888"/>
  <!-- Bras droit / carnet + stylo -->
  <path d="M66 38 L78 45" stroke="#4a3a28" stroke-width="6" stroke-linecap="round" fill="none"/>
  <rect x="74" y="42" width="9" height="13" rx="1" fill="#f0e8c0"/>
  <line x1="83" y1="38" x2="78" y2="52" stroke="#1a1a1a" stroke-width="1.5"/>
</svg>
