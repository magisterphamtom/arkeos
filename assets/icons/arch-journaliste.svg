<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Journaliste</title>
  <circle cx="50" cy="50" r="48" fill="#1a0a02" stroke="#5a3a08" stroke-width="2"/>
