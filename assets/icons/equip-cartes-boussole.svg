<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Cartes &amp; Boussole</title>
  <circle cx="50" cy="50" r="48" fill="#1a0a02" stroke="#5a3a08" stroke-width="2"/>

  <!-- Carte dépliée en fond -->
  <rect x="14" y="22" width="60" height="52" rx="3" fill="#d4b86a" stroke="#8a6010" stroke-width="1.5"/>
  <!-- lignes de relief sur la carte -->
  <path d="M18 35 Q30 30 42 36 Q54 42 66 34 Q72 30 74 32" fill="none" stroke="#8a6010" stroke-width="1" opacity="0.5"/>
  <path d="M18 45 Q28 40 40 46 Q52 52 66 44" fill="none" stroke="#8a6010" stroke-width="1" opacity="0.5"/>
  <path d="M18 56 Q32 50 44 56 Q56 62 70 55" fill="none" stroke="#8a6010" stroke-width="1" opacity="0.5"/>
  <!-- pli vertical de la carte -->
  <line x1="44" y1="22" x2="44" y2="74" stroke="#8a6010" stroke-width="1" opacity="0.4"/>
  <!-- petite croix de localisation -->
  <line x1="56" y1="40" x2="64" y2="40" stroke="#c03010" stroke-width="1.5"/>
  <line x1="60" y1="36" x2="60" y2="44" stroke="#c03010" stroke-width="1.5"/>
  <circle cx="60" cy="40" r="2.5" fill="none" stroke="#c03010" stroke-width="1.5"/>

  <!-- Boussole par-dessus, en bas à gauche -->
  <circle cx="32" cy="62" r="16" fill="#f0e4b0" stroke="#c09020" stroke-width="2"/>
  <circle cx="32" cy="62" r="13" fill="none" stroke="#c09020" stroke-width="1" opacity="0.5"/>
  <!-- points cardinaux -->
  <text x="32" y="52.5" text-anchor="middle" font-size="7" fill="#1a0800" font-weight="bold">N</text>
  <text x="32" y="75" text-anchor="middle" font-size="7" fill="#1a0800" font-weight="bold">S</text>
  <text x="43.5" y="65" text-anchor="middle" font-size="7" fill="#1a0800" font-weight="bold">E</text>
  <text x="20.5" y="65" text-anchor="middle" font-size="7" fill="#1a0800" font-weight="bold">O</text>
  <!-- aiguille nord (rouge) -->
  <path d="M32 62 L32 51" stroke="#c82020" stroke-width="2" stroke-linecap="round"/>
  <!-- aiguille sud (sombre) -->
  <path d="M32 62 L32 71" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>
  <!-- pivot central -->
  <circle cx="32" cy="62" r="2.5" fill="#1a0800"/>
</svg>
