<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Kit radio portatif</title>
  <circle cx="50" cy="50" r="48" fill="#1a0a02" stroke="#5a3a08" stroke-width="2"/>

  <!-- boîtier -->
  <rect x="25" y="35" width="50" height="42" fill="#3a3a28" rx="3"/>
  <!-- antenne -->
  <line x1="65" y1="35" x2="75" y2="15" stroke="#808070" stroke-width="3" stroke-linecap="round"/>
  <!-- cadran -->
  <circle cx="42" cy="52" r="10" fill="#1a1a10"/>
  <circle cx="42" cy="52" r="7" fill="#0a0a08"/>
  <path d="M42 45 L42 52 L47 52" stroke="#e8b848" stroke-width="1.5" fill="none"/>
  <!-- boutons -->
  <circle cx="65" cy="48" r="4" fill="#c04010"/>
  <circle cx="65" cy="60" r="4" fill="#2a6020"/>
  <!-- grille haut-parleur -->
  <line x1="30" y1="68" x2="70" y2="68" stroke="#606050" stroke-width="1.5"/>
  <line x1="30" y1="72" x2="70" y2="72" stroke="#606050" stroke-width="1.5"/>
</svg>