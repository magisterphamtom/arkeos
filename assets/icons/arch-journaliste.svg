  <ellipse cx="50" cy="24" rx="9" ry="10" fill="#f0d0a0"/>
  <!-- Chapeau avec carte PRESSE -->
  <path d="M36 22 Q50 11 64 22 L66 26 L34 26 Z" fill="#3a3020"/>
  <path d="M30 26 L70 26" stroke="#2a2018" stroke-width="3"/>
