  <rect x="74" y="50" width="10" height="12" rx="1" fill="#c8a040"/>
  <!-- Ceinture -->
  <rect x="33" y="58" width="34" height="4" rx="1" fill="#4a3010"/>
  <rect x="47" y="57" width="6" height="6" rx="1" fill="#c0a030"/>
</svg>
