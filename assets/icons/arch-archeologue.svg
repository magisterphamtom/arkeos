  <line x1="20" y1="55" x2="12" y2="63" stroke="#8a6a30" stroke-width="3"/>
  <path d="M10 61 L15 56 L18 60 L14 65 Z" fill="#b0b0b0"/>
  <!-- Bras droit -->
  <path d="M66 38 L78 52" stroke="#6b4a1a" stroke-width="6" stroke-linecap="round" fill="none"/>
