<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <title>Archéologue</title>
  <circle cx="50" cy="50" r="48" fill="#1a0a02" stroke="#5a3a08" stroke-width="2"/>
  <!-- Tête -->
  <ellipse cx="50" cy="24" rx="9" ry="10" fill="#e8c090"/>
  <!-- Corps / veste -->
  <path d="M34 36 L66 36 L68 78 L50 83 L32 78 Z" fill="#6b4a1a"/>
  <!-- Chapeau de brousse -->
  <path d="M36 24 L64 24 L66 20 L50 14 L34 20 Z" fill="#8a6a20"/>
